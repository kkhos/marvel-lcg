<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Champions: Digital Edition Community Build</title>
    <style>
        body {
            background-color: rgb(43, 43, 43);
            color: rgb(198, 198, 198);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .menu {
            text-align: center;
        }

        .custom-btn {
            width: 130px;
            height: 40px;
            color: #fff;
            padding: 10px 25px;
            font-family: 'Lato', sans-serif;
            font-weight: 500;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
            box-shadow:inset 2px 2px 2px 0px rgba(255,255,255,.5),
            7px 7px 20px 0px rgba(0,0,0,.1),
            4px 4px 5px 0px rgba(0,0,0,.1);
            outline: none;
        }
        /* 3 */
        .btn-3 {
            background: rgb(0, 172, 238);
            background: linear-gradient(0deg, rgba(0, 172, 238, 1) 0%, rgba(2, 126, 251, 1) 100%);
            width: 130px;
            height: 40px;
            line-height: 42px;
            padding: 0;
            border: none;

        }

        .btn-3 span {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn-3:before,
        .btn-3:after {
            position: absolute;
            content: "";
            right: 0;
            top: 0;
            background: rgba(2, 126, 251, 1);
            transition: all 0.3s ease;
        }

        .btn-3:before {
            height: 0%;
            width: 2px;
        }

        .btn-3:after {
            width: 0%;
            height: 2px;
        }

        .btn-3:hover {
            background: transparent;
            box-shadow: none;
        }

        .btn-3:hover:before {
            height: 100%;
        }

        .btn-3:hover:after {
            width: 100%;
        }

        .btn-3 span:hover {
            color: rgba(2, 126, 251, 1);
        }

        .btn-3 span:before,
        .btn-3 span:after {
            position: absolute;
            content: "";
            left: 0;
            bottom: 0;
            background: rgba(2, 126, 251, 1);
            transition: all 0.3s ease;
        }

        .btn-3 span:before {
            width: 2px;
            height: 0%;
        }

        .btn-3 span:after {
            width: 0%;
            height: 2px;
        }

        .btn-3 span:hover:before {
            height: 100%;
        }

        .btn-3 span:hover:after {
            width: 100%;
        }

        button:disabled {
            filter: grayscale(1);
            transition: none;
        }
        
        button:disabled span:before,
        button:disabled span:after,
        button:disabled:before,
        button:disabled:after {
            transition: none;
            /* content: unset; */
        }

        #version {
            height: 2rem;
        }

        .wild-mode {
            background: rgb(161, 129, 0);
        }
    </style>
<style>
body{background:radial-gradient(ellipse at 20% 35%,#51308d,#192a5b 43%,#080d22 80%);font-family:system-ui,sans-serif;color:#f2f5ff;box-sizing:border-box;padding:12px 24px;min-height:100dvh;height:auto}.menu{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,1.4fr);align-items:center;gap:22px;width:min(100%,960px);text-align:left}.brand h1{font-size:clamp(30px,5vw,58px);font-weight:950;line-height:.95;letter-spacing:-.06em;margin:8px 0}.brand h2{font-size:16px;color:#b8c6ff}.brand small{color:#a8b8de}.main{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px!important}.custom-btn{width:100%;height:auto;min-height:46px;padding:6px;background:linear-gradient(135deg,#354b86,#242c58);border:1px solid #7285c3;border-radius:10px;box-shadow:0 3px 0 #121c3d;font:800 14px system-ui}.custom-btn:first-child{grid-column:1/-1;min-height:65px;background:linear-gradient(135deg,#a448ed,#3e62e5);font-size:22px;border-color:#c5b4ff}.btn-3::before,.btn-3::after,.btn-3 span::before,.btn-3 span::after{display:none}.btn-3:hover,.btn-3 span:hover{color:white;background:#3c4378}#version{font-size:11px;color:#a9b7e7}.brand .brand-emblem{width:55px;height:55px;display:block}@media(max-width:500px){.menu{grid-template-columns:1fr;text-align:center}body{padding:12px}}
</style></head>

<body>
    <div class="menu">
        <div class="brand"><svg class="brand-emblem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" aria-label="Champions"><rect width="108" height="108" rx="22" fill="#121b3c"/><path fill="#9a6cff" d="M54 9L96 32V76L54 99L12 76V32Z"/><path fill="#233f86" d="M54 18L87 37V71L54 90L21 71V37Z"/><path fill="#f5f4ff" d="M62 24L33 58H52L46 84L77 45H57Z"/></svg><h1>MARVEL<br>CHAMPIONS</h1><h2>디지털 카드게임</h2><div id="version"></div><small>비공식 팬 프로젝트</small></div>
        <script>
            let currentApplicationVersion = null;

            function Open(url) {
                const version = currentApplicationVersion || getCookie('app_version');
                const destination = new URL(url, window.location.origin);
                if (version) {
                    destination.searchParams.set('v', version);
                }
                window.location.href = destination.toString();
            }
        </script>

        <style>
            .main{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
            }
        </style>

        <div class="main">
            <button class="custom-btn btn-3" onclick="Open('scene')">
                <span>새 게임</span>
            </button>
            <button class="custom-btn btn-3" onclick="showSaves()"><span>저장 게임</span></button>
            <button class="custom-btn btn-3" onclick="Open('replay')">
                <span>리플레이</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('deck')">
                <span>덱 편집기</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('cards')">
                <span>카드 보기</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('puzzle')">
                <span>퍼즐</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('credits')">
                <span>제작진</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('artwork')">
                <span>카드 이미지</span>
            </button>
        </div>

        <!-- <hr/>

        <div class="main">
            <button class="custom-btn btn-3 wild-mode" onclick="doReplay('./wild.json')">
                <span>와일드 모드</span>
            </button>
        </div> -->
    </div>

    <script>
        // Function to get a cookie
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        (async () => {
            let version = null;
            try {
                const response = await fetch('/get_version', { cache: 'no-store' });
                if (response.ok) {
                    version = (await response.text()).trim();
                }
            } catch (error) {
                console.warn('Could not retrieve the current application version.', error);
            }
            if (!version) {
                version = getCookie('app_version');
            }
            currentApplicationVersion = version;
            const versionElement = document.querySelector(`#version`);
            versionElement.textContent = version
                ? `Community Build v${version}`
                : 'Community Build';
        })()
    </script>

    <script>
function doReplay(file_name) {
    var ajax = new XMLHttpRequest();
    let cmd = `load_replay?${file_name}`
    ajax.open("GET", cmd, true);
    ajax.onreadystatechange = function () {
        if( this.readyState == 4 ) {
            console.log('ok')
            cmd = ".?hot_seat&3d_scene"
            window.open(cmd)
        }
    }
    ajax.send();
}
    </script>

<dialog id="saved-games" style="background:#192542;color:white;border:1px solid #7285c3;border-radius:12px;width:min(80vw,650px);max-height:85dvh;overflow:auto">
<h2 style="margin:0 0 8px">저장 게임</h2><div id="save-list"></div><p id="save-status" role="status"></p><button onclick="document.getElementById('saved-games').close()">닫기</button>
</dialog>
<script>
async function showSaves(){
 const dialog=document.getElementById('saved-games'), list=document.getElementById('save-list'), status=document.getElementById('save-status');
 if(!dialog.open) dialog.showModal();
 list.replaceChildren();status.textContent='불러오는 중…';
 try {
  const res=await fetch('/mobile_save_slots',{cache:'no-store'});if(!res.ok)throw Error();
  const slots=await res.json();status.textContent='';
  for(const s of slots){
   const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #526080';
   const label=document.createElement('div');label.style.flex='1';label.textContent=(s.slot===0?'빠른 저장':'저장 '+s.slot)+(s.exists?' · '+new Date(s.modified*1000).toLocaleString():' · 비어 있음');row.append(label);
   for(const [name,action] of [['이어하기','resume'],['삭제','delete']]){
    const b=document.createElement('button');b.textContent=name;b.disabled=!s.exists;b.style.cssText='min-height:40px;padding:6px 12px';b.onclick=async()=>{
     if(action==='delete'&&!confirm('이 저장 게임을 삭제할까요?'))return;
     b.disabled=true;try{
      const r=await fetch('/mobile_save_slot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot:s.slot,action})});
      if(r.status===409&&action==='resume'){const m=await import('/public/js/module/artwork.js');dialog.close();m.showArtworkPreparation(()=>b.onclick());return;}
      if(!r.ok)throw Error();
      if(action==='resume')Open('/?hot_seat&3d_scene');else await showSaves();
     }catch(e){status.textContent='처리하지 못했습니다. 다시 시도해 주세요.';b.disabled=false;}
    };row.append(b);
   }list.append(row);
  }
 }catch(e){status.textContent='저장 목록을 불러오지 못했습니다.';}
}
window.MarvelSetup={back:()=>{const d=document.getElementById('saved-games');if(d.open){d.close();return true;}return false;}};
</script>
