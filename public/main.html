<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Champions: Digital Edition Community Build</title>
    <link rel="stylesheet" href="/public/css/menu/home.css">
</head>

<body>
    <div class="menu">
        <div class="brand">
            <img class="brand-emblem" src="/public/images/home/champions.png"
                 width="804" height="435" alt="Marvel Champions: The Card Game">
            <div class="brand-meta"><div id="version"></div><small>비공식 팬 프로젝트</small></div>
        </div>
        <script>
            let currentApplicationVersion = null;

            function Open(url) {
                const version = currentApplicationVersion || getCookie('app_version');
                const destination = new URL(url, window.location.origin);
                if (version) {
                    destination.searchParams.set('v', version);
                }
                window.location.href = destination.toString();
            }
        </script>

        <nav class="main" aria-label="메인 메뉴">
            <button class="custom-btn btn-3" onclick="Open('scene')">
                <span>새 게임</span>
            </button>
            <button class="custom-btn btn-3" onclick="showSaves()"><span>저장 게임</span></button>
            <button class="custom-btn btn-3" onclick="Open('replay')">
                <span>리플레이</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('deck')">
                <span>덱 편집기</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('cards')">
                <span>카드 보기</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('puzzle')">
                <span>퍼즐</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('credits')">
                <span>제작진</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('artwork')">
                <span>카드 이미지</span>
            </button>
        </nav>

        <!-- <hr/>

        <div class="main">
            <button class="custom-btn btn-3 wild-mode" onclick="doReplay('./wild.json')">
                <span>와일드 모드</span>
            </button>
        </div> -->
    </div>

    <script>
        // Function to get a cookie
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        (async () => {
            let version = null;
            try {
                const response = await fetch('/get_version', { cache: 'no-store' });
                if (response.ok) {
                    version = (await response.text()).trim();
                }
            } catch (error) {
                console.warn('Could not retrieve the current application version.', error);
            }
            if (!version) {
                version = getCookie('app_version');
            }
            currentApplicationVersion = version;
            const versionElement = document.querySelector(`#version`);
            versionElement.textContent = version
                ? `Community Build v${version}`
                : 'Community Build';
        })()
    </script>

    <script>
function doReplay(file_name) {
    var ajax = new XMLHttpRequest();
    let cmd = `load_replay?${file_name}`
    ajax.open("GET", cmd, true);
    ajax.onreadystatechange = function () {
        if( this.readyState == 4 ) {
            console.log('ok')
            cmd = ".?hot_seat&3d_scene"
            window.open(cmd)
        }
    }
    ajax.send();
}
    </script>

<dialog id="saved-games" style="background:#172a23;color:white;border:1px solid #759b85;border-radius:12px;width:min(80vw,650px);max-height:85dvh;overflow:auto">
<h2 style="margin:0 0 8px">저장 게임</h2><div id="save-list"></div>
<section id="save-delete-confirm" hidden style="padding:12px;border:1px solid #c07782;border-radius:8px;background:#382333">
 <p id="save-delete-message"></p><p>삭제한 저장 게임은 복구할 수 없습니다.</p>
 <button type="button" id="save-delete-cancel" style="min-height:40px;padding:6px 16px">취소</button>
 <button type="button" id="save-delete-apply" style="min-height:40px;padding:6px 16px;background:#a32540;color:white;border:1px solid #dca3ae;border-radius:6px">삭제 확인</button>
</section><p id="save-status" role="status"></p><button onclick="document.getElementById('saved-games').close()">닫기</button>
</dialog>
<script>
const deletePanel=document.getElementById('save-delete-confirm');
const deleteApply=document.getElementById('save-delete-apply');
const deleteCancel=document.getElementById('save-delete-cancel');
const saveDialog=document.getElementById('saved-games');
const saveList=document.getElementById('save-list');
function cancelSaveDelete(){
 deletePanel.hidden=true;saveList.hidden=false;
 deleteApply.onclick=null;deleteApply.disabled=false;deleteCancel.disabled=false;
}
deleteCancel.onclick=cancelSaveDelete;
saveDialog.addEventListener('close',cancelSaveDelete);
async function showSaves(){
 cancelSaveDelete();
 const dialog=document.getElementById('saved-games'), list=document.getElementById('save-list'), status=document.getElementById('save-status');
 if(!dialog.open) dialog.showModal();
 list.replaceChildren();status.textContent='불러오는 중…';
 try {
  const res=await fetch('/mobile_save_slots',{cache:'no-store'});if(!res.ok)throw Error();
  const slots=await res.json();status.textContent='';
  for(const s of slots){
   const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #527b63';
   const label=document.createElement('div');label.style.flex='1';label.textContent=(s.slot===0?'빠른 저장':'저장 '+s.slot)+(s.exists?' · '+new Date(s.modified*1000).toLocaleString():' · 비어 있음');row.append(label);
   for(const [name,action] of [['이어하기','resume'],['삭제','delete']]){
    const b=document.createElement('button');b.textContent=name;b.disabled=!s.exists;b.style.cssText='min-height:40px;padding:6px 12px';b.onclick=async()=>{
     if(action==='delete'){
      document.getElementById('save-delete-message').textContent=(s.slot===0?'빠른 저장':'저장 '+s.slot)+'을 삭제할까요?';
      saveList.hidden=true;deletePanel.hidden=false;status.textContent='';
      deleteApply.onclick=async()=>{
       deleteApply.disabled=true;deleteCancel.disabled=true;
       try{
        const r=await fetch('/mobile_save_slot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot:s.slot,action:'delete'})});
        if(!r.ok || (await r.json()).result!=='OK')throw Error('Delete failed');
        await showSaves();status.textContent='저장 게임을 삭제했습니다.';
       }catch(e){status.textContent='삭제하지 못했습니다. 다시 시도해 주세요.';deleteApply.disabled=false;deleteCancel.disabled=false;}
      };
      deleteCancel.focus();return;
     }
     b.disabled=true;try{
      const r=await fetch('/mobile_save_slot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot:s.slot,action})});
      if(r.status===409&&action==='resume'){const m=await import('/public/js/module/artwork.js');dialog.close();m.showArtworkPreparation(()=>b.onclick());return;}
      if(!r.ok)throw Error();
      if(action==='resume')Open('/?hot_seat&3d_scene');else await showSaves();
     }catch(e){status.textContent='처리하지 못했습니다. 다시 시도해 주세요.';b.disabled=false;}
    };row.append(b);
   }list.append(row);
  }
 }catch(e){status.textContent='저장 목록을 불러오지 못했습니다.';}
}
window.MarvelSetup={back:()=>{const d=document.getElementById('saved-games');if(d.open){if(!deletePanel.hidden){if(!deleteApply.disabled)cancelSaveDelete();return true;}d.close();return true;}return false;}};
</script>
</body>

</html>
