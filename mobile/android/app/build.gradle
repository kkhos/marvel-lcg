plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.kkhos.marvellcg'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.kkhos.marvellcg'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.3-mobile-layout'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/gameAssets'))
}

chaquopy {
    defaultConfig {
        version = '3.12'
        pip {
            install '-r', '../requirements-mobile.txt'
        }
    }
}

// Keep upstream paths and dynamic card imports intact. Compile TS before Gradle.
def upstream = rootProject.projectDir.parentFile.parentFile
def gameBundle = tasks.register('bundleGame', Zip) {
    from(upstream) {
        include 'core/**', 'engine/**', 'game/**', 'cards/**', 'data/**',
                'deck/**', 'public/**', 'assets/**', 'editor/**',
                'build.py', 'build_marvel.py', 'launch.json', 'ATTRIBUTION.md'
        exclude '**/__pycache__/**', '**/*.pyc', '**/node_modules/**',
                '**/*.ts', '**/*.js.map', 'assets/pics/**'
    }
    archiveFileName = 'game.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/gameAssets')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    doFirst {
        if (!new File(upstream, 'public/js/marvel/marvel.js').isFile()) {
            throw new GradleException('Compile frontend: npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json (from repo root)')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(gameBundle) }
