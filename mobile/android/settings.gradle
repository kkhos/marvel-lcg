pluginManagement {
    repositories {
        google {
            content {
                excludeGroupByRegex('com[.]chaquo[.]python([.].*)?')
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    // Resolve the published implementation directly instead of relying on
    // the extra plugin-marker POM request, which intermittently fails in CI.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.chaquo.python') {
                useModule("com.chaquo.python:gradle:${requested.version}")
            }
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'MarvelLcgMobile'
include ':app'
