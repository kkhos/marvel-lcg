pluginManagement {
    repositories {
        google {
            content {
                excludeGroupByRegex('com[.]chaquo[.]python([.].*)?')
            }
        }
        if (System.getenv('MARVEL_CENTRAL_MIRROR') == '1') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        } else { mavenCentral() }
        gradlePluginPortal()
    }
    // Resolve the published implementation directly instead of relying on
    // the extra plugin-marker POM request, which intermittently fails in CI.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.chaquo.python') {
                useModule("com.chaquo.python:gradle:${requested.version}")
            }
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        if (System.getenv('MARVEL_CENTRAL_MIRROR') == '1') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        } else { mavenCentral() }
    }
}
rootProject.name = 'MarvelLcgMobile'
include ':app'
