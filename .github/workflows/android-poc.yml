name: Android runtime PoC

on:
  workflow_dispatch:
  push:
    branches: ['mobile/android-poc']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-poc.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Android SDK (preinstalled on hosted runner)
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          "$sdkmanager_bin" --version
          "$sdkmanager_bin" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json
      - run: gradle -p mobile/android :app:assembleDebug --stacktrace
      # Intentionally no APK artifact upload until distribution permission is checked.
