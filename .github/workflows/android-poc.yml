name: Android runtime PoC

on:
  workflow_dispatch:
  push:
    branches: ['mobile/android-poc']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-poc.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Android SDK (preinstalled on hosted runner)
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          "$sdkmanager_bin" --version
          "$sdkmanager_bin" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json
      - name: Restore persistent debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Set ANDROID_DEBUG_KEYSTORE_BASE64 in repository Actions secrets before building an update."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - run: gradle -p mobile/android :app:assembleDebug --stacktrace
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: marvel-lcg-android-poc-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
