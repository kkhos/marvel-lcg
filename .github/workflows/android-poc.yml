name: Android APK and mobile UI regression

on:
  workflow_dispatch:
    inputs:
      personal_ko:
        description: 'Embed Korean community data (private repositories only)'
        type: boolean
        default: true
  push:
    branches: ['mobile/android-poc']
    paths:
      - 'mobile/android/**'
      - 'public/**'
      - 'engine/**'
      - 'game/**'
      - 'cards/**'
      - 'core/**'
      - 'data/**'
      - 'deck/**'
      - 'assets/**'
      - 'tests/mobile/**'
      - 'launch.json'
      - 'build*.py'
      - '.github/workflows/android-poc.yml'

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage checked-in home background for UI tests
        run: |
          test -s mobile/android/app/src/main/assets/splash/doom.webp
          cp mobile/android/app/src/main/assets/splash/doom.webp public/images/home/doom.webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare personal Korean bundle
        if: github.event.repository.private && (github.event_name != 'workflow_dispatch' || inputs.personal_ko)
        run: python mobile/android/prepare_ko.py
      - name: Install test dependencies
        run: |
          python -m pip install -r mobile/android/requirements-mobile.txt playwright==1.51.0
          python -m playwright install --with-deps chromium
          npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json
      - name: Run mobile-only UI tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/mobile
          python -u tests/mobile/server.py >test-results/mobile/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python tests/mobile/test_mobile.py
      - name: Upload mobile regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-regression
          path: test-results/mobile/
          if-no-files-found: warn
          retention-days: 7
  assemble:
    needs: mobile-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Android SDK (preinstalled on hosted runner)
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          "$sdkmanager_bin" --version
          "$sdkmanager_bin" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare personal Korean bundle
        if: github.event.repository.private && (github.event_name != 'workflow_dispatch' || inputs.personal_ko)
        run: python mobile/android/prepare_ko.py
      - run: npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json
      - name: Restore persistent debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Set ANDROID_DEBUG_KEYSTORE_BASE64 in repository Actions secrets before building an update."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/marvel-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          echo "MARVEL_DEBUG_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
      - name: Verify checked-in splash backdrop
        run: test -s mobile/android/app/src/main/assets/splash/doom.webp
      - name: Assemble Android APK (retry transient repository failures)
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gradle-assemble.log"
          for attempt in 1 2 3; do
            if gradle -p mobile/android :app:assembleDebug --stacktrace --info 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq 'UnknownPluginException|could not resolve plugin artifact|Could not (GET|HEAD|resolve|download)|Read timed out|Connection reset|status code (429|50[0234])' "$log"; then
              exit 1
            fi
            echo "::warning::Dependency resolution failed on attempt $attempt; retrying."
            if grep -Eiq '429 Too Many Requests|status code 429' "$log"; then
              export MARVEL_CENTRAL_MIRROR=1
              echo "::warning::Maven Central rate-limited the runner; retrying via Google Cloud's Central mirror."
            fi
            sleep $((attempt * 20))
          done
      - name: Verify bundled splash assets
        run: |
          python -c 'import zipfile,struct,hashlib; z=zipfile.ZipFile("mobile/android/app/build/outputs/apk/debug/app-debug.apk"); p=z.read("assets/splash/champions.png"); assert struct.unpack(">II",p[16:24])==(804,435); assert hashlib.sha256(p).hexdigest()=="490c4c9672cb57fe0e15201096a68aac25bd8c2bbe1703b8e9b2007676d945e2"; import io; d=z.read("assets/splash/doom.webp"); game=zipfile.ZipFile(io.BytesIO(z.read("assets/game.zip"))); assert d==game.read("public/images/home/doom.webp"); print("High-resolution logo and shared offline background verified")'
      - name: Verify bundled Korean descriptions
        if: github.event.repository.private && (github.event_name != 'workflow_dispatch' || inputs.personal_ko)
        run: |
          python -c 'import io,zipfile; a=zipfile.ZipFile("mobile/android/app/build/outputs/apk/debug/app-debug.apk"); g=zipfile.ZipFile(io.BytesIO(a.read("assets/game.zip"))); s=g.read("public/js/marvel/ko-bundled.js").decode(); assert "03001a" in s and len(s)>20000; print("Personal Korean module verified inside APK")'
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          expected="$(keytool -exportcert -keystore "$MARVEL_DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signing.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signing.txt" | tr '[:upper:]' '[:lower:]')"
          echo "Expected signing certificate SHA-256: $expected"
          echo "Actual signing certificate SHA-256: $actual"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::APK signing certificate differs from the persistent key."
            exit 1
          fi
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: marvel-lcg-android-poc-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
