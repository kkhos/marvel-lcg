name: Android runtime PoC

on:
  workflow_dispatch:
  push:
    branches: ['mobile/android-poc']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-poc.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json
      - run: gradle -p mobile/android :app:assembleDebug --stacktrace
      # Intentionally no APK artifact upload until distribution permission is checked.
