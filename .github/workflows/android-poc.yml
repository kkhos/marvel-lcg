name: Android APK and mobile UI regression

on:
  workflow_dispatch:
  push:
    branches: ['mobile/android-poc']
    paths:
      - 'mobile/android/**'
      - 'public/**'
      - 'engine/**'
      - 'game/**'
      - 'cards/**'
      - 'core/**'
      - 'data/**'
      - 'deck/**'
      - 'assets/**'
      - 'tests/mobile/**'
      - 'launch.json'
      - 'build*.py'
      - '.github/workflows/android-poc.yml'

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r mobile/android/requirements-mobile.txt playwright==1.51.0
          python -m playwright install --with-deps chromium
          npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json
      - name: Run mobile-only UI tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/mobile
          python -u tests/mobile/server.py >test-results/mobile/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python tests/mobile/test_mobile.py
      - name: Upload mobile regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-regression
          path: test-results/mobile/
          if-no-files-found: warn
          retention-days: 7
  assemble:
    needs: mobile-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Android SDK (preinstalled on hosted runner)
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          "$sdkmanager_bin" --version
          "$sdkmanager_bin" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npx --yes --package typescript@5.9.3 tsc -p public/js/tsconfig.json
      - name: Restore persistent debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Set ANDROID_DEBUG_KEYSTORE_BASE64 in repository Actions secrets before building an update."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/marvel-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          echo "MARVEL_DEBUG_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
      - name: Prepare optional offline splash backdrop
        shell: bash
        run: |
          set -eu
          dest=mobile/android/app/src/main/assets/splash/doom.webp
          if curl --fail --location --retry 1 --connect-timeout 8 --max-time 25 \
              'https://disney.images.edge.bamgrid.com/ripcut-delivery/v2/variant/disney/002085A1CE8A7388B940AF1093C7A3D1B8A3B0C17A424070D7AE2D25D701C2D1/compose?format=webp&width=2560' -o "$dest.tmp" && \
              python -c 'import sys; d=open(sys.argv[1],"rb").read(12); assert d[:4]==b"RIFF" and d[8:12]==b"WEBP"' "$dest.tmp"; then
            mv "$dest.tmp" "$dest"
            echo "Doom backdrop bundled for offline startup."
          else
            rm -f "$dest.tmp"
            echo "::warning::Doom backdrop unavailable; using built-in green gradient."
          fi
      - name: Assemble Android APK (retry transient repository failures)
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gradle-assemble.log"
          for attempt in 1 2 3; do
            if gradle -p mobile/android :app:assembleDebug --stacktrace --info 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq 'UnknownPluginException|could not resolve plugin artifact|Could not (GET|HEAD|resolve|download)|Read timed out|Connection reset|status code (429|50[0234])' "$log"; then
              exit 1
            fi
            echo "::warning::Dependency resolution failed on attempt $attempt; retrying."
            sleep $((attempt * 10))
          done
      - name: Verify bundled splash assets
        run: |
          python -c 'import zipfile; z=zipfile.ZipFile("mobile/android/app/build/outputs/apk/debug/app-debug.apk"); assert "assets/splash/champions.png" in z.namelist(); print("Doom backdrop bundled:", "assets/splash/doom.webp" in z.namelist())'
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          expected="$(keytool -exportcert -keystore "$MARVEL_DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signing.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signing.txt" | tr '[:upper:]' '[:lower:]')"
          echo "Expected signing certificate SHA-256: $expected"
          echo "Actual signing certificate SHA-256: $actual"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::APK signing certificate differs from the persistent key."
            exit 1
          fi
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: marvel-lcg-android-poc-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
